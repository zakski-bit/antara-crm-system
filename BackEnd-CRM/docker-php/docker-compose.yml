services:
  mariadb:
    image: mariadb:11.8
    container_name: app_mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend
    ports:
      - "3307:3306"

  php:
    build: .
    container_name: app_php
    volumes:
      - ./php:/var/www/html
    env_file:
      - .env
    depends_on:
      - mariadb
    networks:
      - backend

  nginx:
    image: nginx:latest
    container_name: app_nginx
    ports:
      - "8080:80"
    volumes:
      - ./php:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - backend

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: app_pma
    environment:
      PMA_HOST: ${DB_HOST}
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "8081:80"
    depends_on:
      - mariadb
    networks:
      - backend

volumes:
  db_data:

networks:
  backend:
    driver: bridge
